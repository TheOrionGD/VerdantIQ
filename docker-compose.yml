version: '3.8'

services:
  postgres:
    image: postgis/postgis:15-3.3
    container_name: ecosphere-postgres
    environment:
      POSTGRES_DB: ecosphere
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: ecosphere-redis
    ports:
      - "6379:6379"

  ml-service:
    build: ./ml-service
    container_name: ecosphere-ml-service
    ports:
      - "8000:8000"
    environment:
      - PORT=8000

  backend:
    build: ./backend
    container_name: ecosphere-backend
    ports:
      - "8080:8080"
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=ecosphere
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgrespassword
      - REDIS_HOST=redis
      - ML_SERVICE_HOST=ml-service
    depends_on:
      - postgres
      - redis
      - ml-service

  frontend:
    build: ./frontend
    container_name: ecosphere-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
